# NG 例 (ja): symbols と notation のセットの行が、日本語の値に一致することを確かめる。
# 各値の行の前の「# expect: <規則>」は、その規則がその行に一致することを求める (行の先頭の指定を除いた正規表現で書く)。
# --selftest は、一致を確かめる前に値を今の ja_style.txt の書き方に変換する (OK 例と同じ。forbidden_ui_words.py の
# fixture_text_in_style) ので、値は spacing=A と半角の疑問符で書く。疑問符の行 (ja:question=fullwidth:\?) は、変換すると
# 一致しなくなるので、ここでは確かめない (書き方の指定と疑問符の行は、mechanism のテスト用の一覧で確かめる)。
