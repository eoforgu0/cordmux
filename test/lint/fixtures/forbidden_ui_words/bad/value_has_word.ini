# NG 例: 値の中に内部の語 (adapter、決めたこと) がある。
# 各値の行の前の「# expect: <規則>」は、その規則がその行に一致することを求める (forbidden_ui_words.py の
# --selftest。expect のない値の行に何かが一致すると失敗にする)。
# expect: \badapter\b
cordmux.dock.test.bad_value="この画面には adapter という語が出ています"
# expect: 決めたこと
cordmux.dock.test.bad_internal="決めたことのとおりです"
# NG 例: 内部の語の直後に、空白を挟まずに日本語の助詞が続く。Unicode の \b は、かなと漢字も \w とみなすので、
# re.ASCII を付けないと、ここで単語境界ができずに一致しない (test/lint/forbidden_ui_words.py の parse_word_rules)。
# spacing のセットの空白の行もこの 3 行に一致するが、expect で internal-words の行が一致することも求めるので、
# re.ASCII の効果を確かめられる。
# expect: \bssrc\b
cordmux.dock.test.bad_value_particle1="ssrcの値が読めません"
# expect: \badapter\b
cordmux.dock.test.bad_value_particle2="adapterが見つかりません"
# expect: \broster\b
cordmux.dock.test.bad_value_particle3="rosterを再読み込みします"
