# テスト用の一覧 (words.txt) の ja の例: 「# expect[条件]: <規則>」は、条件の書き方のときだけ、その規則が次の行に
# 一致することを求める。expect のない行には、どの書き方でも何も一致しない。
# expect: だめ
k.lang_ja="だめです"
# en: の行は ja の ini には使わない
k.lang_en="a bad word"
# expect: \binternal\b
k.internal="internal"
# 語の直後に、空白を挟まずに日本語の助詞が続く。一覧の行は re.ASCII でコンパイルするので、l と「の」の間も語の境目に
# なり、\b が一致する (forbidden_ui_words.py の parse_word_rules)
# expect: \binternal\b
k.internal_particle="internalの値"
# expect[spacing=A]: [A-Za-z0-9%][ぁ-ヿ一-鿿]
k.spacing_missing="OBSの設定"
# expect[spacing=A]: [ぁ-ヿ一-鿿][A-Za-z0-9%]
k.spacing_missing_before="設定OBS"
# expect[spacing=B]: [A-Za-z0-9%] [ぁ-ヿ一-鿿]
k.spacing_present="OBS の設定"
# expect[spacing=B]: [ぁ-ヿ一-鿿] [A-Za-z0-9%]
k.spacing_present_before="設定 OBS"
# name_keys のキー (OBS の一覧に表示する名前) には、spacing=B の空白の行を使わない (not_names)
cordmux.source.slot.label="cordmux 画面共有 1"
# expect[question=fullwidth]: \?
k.question_half="切り替えますか?"
# expect[question=halfwidth]: [？！]
k.question_full="切り替えますか？"
# expect[question=halfwidth]:  \?
# expect[question=fullwidth]: \?
k.space_half="ID ?"
# expect[question=fullwidth]:  ？
# expect[question=halfwidth]: [？！]
k.space_full="ID ？"
# expect[question=halfwidth]: [？！]
# expect[question=fullwidth]: ！
k.bang="完了！"
