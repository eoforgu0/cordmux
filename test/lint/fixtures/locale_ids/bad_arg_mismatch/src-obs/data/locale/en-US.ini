# NG 例: summary_connected.status に %2 がない (ja-JP.ini には %1 と %2 がある)

# %1=接続先の名前
cordmux.dock.summary_connected.status="Connected (%1)"
cordmux.dock.export_diagnostics.button="Export diagnostics"

# %1=通話に参加している人数。1 のときは _one
cordmux.dock.summary_call.status="In a call (%1 people)"
# cordmux.dock.summary_call.status の、%1 が 1 のときの形。%1=通話に参加している人数
cordmux.dock.summary_call.status_one="In a call (%1 person)"
# %1=削除した人数、%2=削除した時刻
cordmux.dock.past_removed.headline="Removed settings for %1 people (%2)"
# 元のキーの、%1 が 1 のときの形。%1=削除した人数、%2=削除した時刻
cordmux.dock.past_removed.headline_one="Removed settings for %1 person (%2)"
