# NG 例: summary_connected.status の %N が en-US.ini と食い違う (ja は %1 と %2、en は %1 だけ)

# %1=接続先の名前、%2=接続先のバージョン
cordmux.dock.summary_connected.status="つながっています (%1 / %2)"
cordmux.dock.export_diagnostics.button="診断情報をエクスポート"

# %1=通話に参加している人数。1 のときは _one
cordmux.dock.summary_call.status="通話中 (%1 人)"
# cordmux.dock.summary_call.status の、%1 が 1 のときの形。%1=通話に参加している人数
cordmux.dock.summary_call.status_one="通話中 (%1 人)"
# %1=削除した人数、%2=削除した時刻
cordmux.dock.past_removed.headline="%1 人の設定を削除しました (%2)"
# 元のキーの、%1 が 1 のときの形。%1=削除した人数、%2=削除した時刻
cordmux.dock.past_removed.headline_one="%1 人の設定を削除しました (%2)"
