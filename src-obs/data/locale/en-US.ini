# cordmux の画面の文言 (en-US)。画面に表示する文言は、すべてここに書く。ja-JP.ini とキーの集合が同じで、
# コードのキーと過不足なく一致することを test/lint/locale_ids.py がチェックする。

# キーは cordmux.<画面>.<もの>.<種類>。種類はキーの最後の区切りで、コンポーネントの種類を表す
# (.button .menu .page .heading .label .option .check .status .title .headline .text .tip .empty .a11y)。
# 英語の形が数で変わる文字列は、数がちょうど 1 のときのキー <キー>_one を組で持つ。ja-JP の _one は元のキーと同じ文字列。
# %N に何が入るかを、キーの行の真上のコメントに「%N=中身」の形で書く。
# コードは src-obs/ledger/text_ids.h の名前空間 text::keys の定数で参照する。

